<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리집가계부 — 비밀번호 재설정</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="screen" style="display:flex;flex-direction:column;align-items:center;">

  <div style="width:72px;height:72px;border-radius:20px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:34px;margin-top:60px;">🔑</div>
  <div style="margin-top:16px;font-size:19px;font-weight:800;">새 비밀번호 설정</div>
  <div id="resetStatus" style="margin-top:8px;font-size:13px;color:var(--subtext);text-align:center;">이메일의 링크로 들어오셨다면, 아래에 새 비밀번호를 입력해주세요.</div>

  <form id="resetForm" style="margin-top:28px;width:100%;display:flex;flex-direction:column;gap:16px;">
    <div class="field">
      <label>새 비밀번호</label>
      <input type="password" id="newPassword" placeholder="6자 이상" minlength="6" required>
    </div>
    <div class="field">
      <label>새 비밀번호 확인</label>
      <input type="password" id="newPassword2" placeholder="한 번 더 입력" minlength="6" required>
    </div>
    <button type="submit" class="btn-primary" style="margin-top:8px;">비밀번호 변경하기</button>
  </form>

  <div style="margin-top:18px;font-size:12.5px;color:var(--subtext);">
    <a href="login.html">로그인 화면으로 돌아가기</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script>
initTheme();

let recoveryReady = false;
sb.auth.onAuthStateChange((event, session) => {
  if (session) recoveryReady = true;
});

setTimeout(async () => {
  if (!recoveryReady) {
    const session = await getSession();
    if (session) recoveryReady = true;
  }
  if (!recoveryReady) {
    document.getElementById('resetStatus').textContent = '유효하지 않거나 만료된 링크예요. 로그인 화면에서 "비밀번호를 잊으셨나요?"로 다시 요청해주세요.';
    document.getElementById('resetForm').classList.add('hidden');
  }
}, 1500);

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const p1 = document.getElementById('newPassword').value;
  const p2 = document.getElementById('newPassword2').value;
  if (p1 !== p2) { showToast('비밀번호가 서로 달라요'); return; }
  if (p1.length < 6) { showToast('6자 이상 입력해주세요'); return; }
  const { error } = await sb.auth.updateUser({ password: p1 });
  if (error) { showToast('변경 실패: ' + error.message); return; }
  document.getElementById('resetStatus').textContent = '비밀번호가 변경됐어요! 잠시 후 이동합니다.';
  document.getElementById('resetForm').classList.add('hidden');
  setTimeout(() => { location.href = 'index.html'; }, 1500);
});
</script>
</body>
</html>
